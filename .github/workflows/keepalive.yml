name: supabase-keepalive

# Free-tier Supabase projects pause after ~7 days with no API activity. This
# pings the project's REST endpoint every 3 days — a real, lightweight
# authenticated request, just enough to keep it from ever going idle. Uses
# the publishable (anon) key, which is meant to be public — it already ships
# inside the built app and is protected by Row Level Security, not secrecy.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            "https://jekyajsfbrdovxjfvhei.supabase.co/rest/v1/shops?select=id&limit=1" \
            -H "apikey: sb_publishable_LlNN014R5Jwoulx-OAapfQ_pWE8qQ4r"
